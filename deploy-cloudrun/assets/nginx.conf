# --- PROJECT CONFIG: replace example.com with the project's domain -----------
# Redirect www to non-www
server {
    listen 8080;
    server_name www.example.com;
    return 301 https://example.com$request_uri;
}

# Main server
server {
    listen 8080 default_server;
    server_name example.com _;
# ------------------------------------------------------------------------------

    root /usr/share/nginx/html;
    index index.html;

    # Disable port in redirects (Cloud Run uses 8080 internally but 443 externally)
    port_in_redirect off;
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # index.html — never cache (references runtime config.js)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # config.js — never cache: it is regenerated by docker-entrypoint.sh on every
    # container start, so a cached copy would pin clients to a stale API URL
    location = /config.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets — cache aggressively (hashed filenames)
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt and sitemap.xml — short cache
    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # SPA routing: serve pre-rendered HTML if it exists, then index.html fallback
    # Pre-rendered routes have /route/index.html in dist/
    #
    # The no-cache headers must be repeated HERE: when try_files serves
    # index.html (or a pre-rendered page) as a fallback FILE, the
    # `location = /index.html` block above never runs, so `/` and SPA deep
    # links would otherwise ship with no Cache-Control at all — browsers then
    # heuristically cache a stale index.html across deploys, pinning users to
    # dead hashed-asset URLs. Any add_header inside a location suppresses the
    # server-level ones, so the security headers are repeated too.
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        try_files $uri $uri/index.html /index.html =404;
    }
}
